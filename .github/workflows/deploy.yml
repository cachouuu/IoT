name: Deploy IoT coursework

on:
  push:
    branches: [main]
    paths:
      - 'DIC1/**'
      - 'HW1/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Serialize manual and source-update deployments.
concurrency:
  group: iot-pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v4.2.2
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Test the weather data pipeline
        working-directory: HW1
        run: python -m unittest discover -s tests -v

      - name: Refresh the CWA snapshot when configured
        if: github.event_name != 'push'
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        shell: bash
        run: |
          if [ -z "$CWA_API_KEY" ]; then
            echo "CWA_API_KEY is not configured. Publishing the existing labeled snapshot without fetching new weather."
            exit 0
          fi
          cd HW1
          python export_weather.py

      - name: Commit only the public weather snapshot when changed
        if: github.event_name != 'push'
        shell: bash
        run: |
          git add -- HW1/docs/data/forecast.json
          if git diff --cached --quiet -- HW1/docs/data/forecast.json; then
            echo "No public snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update public weather snapshot"
          git push origin HEAD:main

      - name: Assemble the coursework website
        run: |
          mkdir -p _site/HW1
          cp DIC1/index.html DIC1/style.css DIC1/app.js DIC1/.nojekyll _site/
          cp -R DIC1/assets _site/assets
          cp -R HW1/docs/. _site/HW1/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
